name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: flutter analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  api:
    name: backend starts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Pas encore de tests cote API : on verifie au moins que chaque module
      # se charge, ce qui attrape les fautes de frappe et les imports casses.
      - run: node --check server.js
      - run: for f in routes/*.js models/*.js middleware/*.js utils/*.js; do node --check "$f"; done
